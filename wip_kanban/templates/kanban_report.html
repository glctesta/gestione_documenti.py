<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ ui.title_report }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="brand">
      <img src="{{ url_for('static', filename='Logo.png') }}" alt="Logo" class="logo">
      <h1>{{ ui.title_report }}</h1>
    </div>
  </header>

  <main>
    <div id="message" class="message" style="display:none;"></div>

    <section class="panel">
      <h2>{{ ui.report_filters }}</h2>
      <div class="actions" style="flex-wrap: wrap; gap: 1rem;">
        <label style="display:flex; flex-direction:column; gap:0.25rem;">
          <span>{{ ui.filter_order }}</span>
          <select id="order-select"><option value="">{{ ui.filter_all }}</option></select>
        </label>
        <label style="display:flex; flex-direction:column; gap:0.25rem;">
          <span>{{ ui.filter_type }}</span>
          <select id="type-select">
            <option value="all">{{ ui.type_all }}</option>
            <option value="wip">{{ ui.type_wip }}</option>
            <option value="repair">{{ ui.type_repair }}</option>
          </select>
        </label>
        <label style="display:flex; flex-direction:column; gap:0.25rem;">
          <span>{{ ui.filter_product }}</span>
          <select id="product-select"><option value="">{{ ui.filter_all }}</option></select>
        </label>
        <label style="display:flex; flex-direction:column; gap:0.25rem;">
          <span>{{ ui.filter_state }}</span>
          <select id="state-select">
            <option value="all">{{ ui.state_all }}</option>
            <option value="fail">{{ ui.state_fail }}</option>
            <option value="wip">{{ ui.state_wip }}</option>
          </select>
        </label>
        <button id="excel-btn" style="align-self:flex-end;">{{ ui.generate_excel }}</button>
      </div>
    </section>
  </main>

  <script>
    const UI = {{ ui|tojson }};

    const $ = id => document.getElementById(id);
    const msg = (text, type = 'info') => {
      const el = $('message');
      el.textContent = text;
      el.className = 'message ' + type;
      el.style.display = 'block';
    };

    function fillSelect(id, values) {
      const sel = $(id);
      const first = sel.querySelector('option');
      sel.innerHTML = '';
      sel.appendChild(first);
      values.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        sel.appendChild(opt);
      });
    }

    async function loadFilters() {
      try {
        const res = await fetch('/kanban/api/report/filters');
        const data = await res.json();
        fillSelect('order-select', data.orders || []);
        fillSelect('product-select', data.products || []);
      } catch (e) {
        msg(UI.msg_error + (e.message || e), 'error');
      }
    }

    $('excel-btn').addEventListener('click', () => {
      const params = new URLSearchParams();
      params.set('order', $('order-select').value);
      params.set('type', $('type-select').value);
      params.set('product', $('product-select').value);
      params.set('state', $('state-select').value);
      window.location = '/kanban/api/report.xlsx?' + params.toString();
    });

    loadFilters();
  </script>
</body>
</html>
