<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ ui.title_generic }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="brand">
      <img src="{{ url_for('static', filename='Logo.png') }}" alt="Logo" class="logo">
      <h1>{{ ui.title_generic }}</h1>
    </div>
    <span class="user">{{ ui.user }}: {{ user }}</span>
  </header>

  <main>
    <div id="message" class="message" style="display:none;"></div>

    <section class="panel">
      <h2>{{ ui.label }}</h2>
      <input type="text" id="label-filter" placeholder="{{ ui.filter_label }}" autocomplete="off">
      <select id="label-select" size="8">
        <option value="">{{ ui.select_label }}</option>
      </select>

      <div id="label-info" class="info" style="margin-top:0.5rem;"></div>
    </section>

    <section class="panel" id="print-settings" style="display:none;">
      <h2>Settings</h2>
      <div class="materials">
        <div>
          <label><strong>{{ ui.ribbon }}</strong><br><span id="ribbon-info">-</span></label>
        </div>
        <div>
          <label><strong>{{ ui.printer }}</strong>
            <select id="printer-select">
              <option value="">{{ ui.select_printer }}</option>
            </select>
          </label>
        </div>
        <div id="counter-section">
          <label><strong>{{ ui.counter }}</strong>
            <input type="number" id="counter-input" min="0" step="1">
          </label>
          <label><strong>{{ ui.prefix }}</strong>
            <input type="text" id="prefix-input" maxlength="50">
          </label>
          <label><strong>{{ ui.suffix }}</strong>
            <input type="text" id="suffix-input" maxlength="50">
          </label>
        </div>
      </div>

      <div style="margin-top:1rem;">
        <label><strong>{{ ui.quantity }}</strong>
          <input type="number" id="quantity-input" min="1" step="1" value="1" style="width:8rem;">
        </label>
      </div>

      <div style="margin-top:1rem;">
        <label><strong>{{ ui.script }}</strong>
          <textarea id="script-text" rows="10"></textarea>
        </label>
      </div>

      <div class="actions" style="margin-top:1rem;">
        <button id="print-btn">{{ ui.print }}</button>
        <button id="back-btn" class="secondary">{{ ui.back_to_management }}</button>
      </div>
    </section>
  </main>

  <script>
    const UI = {{ ui|tojson }};
    const LANG = "{{ lang }}";
    const TOKEN = new URLSearchParams(window.location.search).get('token') || '';
    let labels = [];
    let printers = [];
    let currentLabel = null;
    let currentScript = '';

    const $ = id => document.getElementById(id);
    const msg = (text, type = 'info') => {
      const el = $('message');
      el.textContent = text;
      el.className = 'message ' + type;
      el.style.display = 'block';
    };
    const clearMsg = () => {
      $('message').style.display = 'none';
      $('message').textContent = '';
    };

    async function safeJson(res) {
      const text = await res.text();
      try { return JSON.parse(text); } catch (e) { return { error: 'invalid_response', message: text.substring(0, 200) }; }
    }

    async function apiFetch(url, options = null) {
      const tokenParam = TOKEN ? (url.includes('?') ? '&token=' + TOKEN : '?token=' + TOKEN) : '';
      const res = await fetch(url + tokenParam, options);
      const data = await safeJson(res);
      if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`);
      return data;
    }

    async function loadData() {
      try {
        const data = await apiFetch('/print/api/generic/data');
        labels = data.labels || [];
        printers = data.printers || [];
        renderLabelSelect('');
        renderPrinterSelect(data.default_printer);
      } catch (e) {
        msg(UI.msg_error + (e.message || e), 'error');
      }
    }

    function renderLabelSelect(filterText) {
      const sel = $('label-select');
      sel.innerHTML = '<option value="">' + UI.select_label + '</option>';
      const term = (filterText || '').toLowerCase().trim();
      const filtered = term ? labels.filter(l =>
        (l.MaterialCode || '').toLowerCase().includes(term) ||
        (l.MaterialDescription || '').toLowerCase().includes(term)
      ) : labels.slice();
      filtered.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.materialeid;
        opt.textContent = `${l.MaterialCode} - ${l.MaterialDescription}`;
        sel.appendChild(opt);
      });
    }

    function renderPrinterSelect(defaultPrinter) {
      const sel = $('printer-select');
      sel.innerHTML = '<option value="">' + UI.select_printer + '</option>';
      printers.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.LabelPrinterId;
        opt.textContent = `${p.PrinterName} (${p.PrinterType})`;
        sel.appendChild(opt);
      });
      if (defaultPrinter) sel.value = defaultPrinter.LabelPrinterId;
    }

    function selectListByValue(id, value) {
      const sel = $(id);
      for (const opt of sel.options) {
        if (opt.value == value) { opt.selected = true; return true; }
      }
      sel.selectedIndex = -1;
      return false;
    }

    function onLabelChange() {
      clearMsg();
      const labelId = parseInt($('label-select').value, 10) || null;
      currentLabel = labelId ? labels.find(l => l.materialeid === labelId) : null;
      if (!currentLabel) {
        $('print-settings').style.display = 'none';
        $('label-info').textContent = '';
        return;
      }
      $('print-settings').style.display = 'block';
      $('label-info').textContent = `${currentLabel.MaterialCode} - ${currentLabel.MaterialDescription}`;

      const ribbon = currentLabel.ribbon || {};
      $('ribbon-info').textContent = ribbon.RibbonId
        ? (ribbon.RibbonDescription || ribbon.RibbonId)
        : UI.no_ribbon;

      selectListByValue('printer-select', (currentLabel.printer || {}).LabelPrinterId);

      const counter = currentLabel.counter || { LastCounter: 0, Prefix: '', Suffix: '' };
      const isTrace = currentLabel.is_traceability;
      $('counter-section').style.display = isTrace ? 'none' : 'block';
      if (!isTrace) {
        $('counter-input').value = counter.LastCounter || 0;
        $('prefix-input').value = counter.Prefix || '';
        $('suffix-input').value = counter.Suffix || '';
      } else {
        msg(UI.traceability_label, 'info');
      }

      currentScript = currentLabel.script || '';
      $('script-text').value = currentScript;
      if (!currentScript && !isTrace) msg(UI.no_script, 'info');
    }

    $('label-filter').addEventListener('input', () => renderLabelSelect($('label-filter').value));
    $('label-select').addEventListener('change', onLabelChange);

    $('back-btn').addEventListener('click', () => {
      window.location.href = '/bom?token=' + TOKEN + '&lang=' + LANG;
    });

    $('print-btn').addEventListener('click', async () => {
      clearMsg();
      if (!currentLabel) { msg(UI.msg_error + ' ' + UI.select_label, 'error'); return; }
      const printerId = parseInt($('printer-select').value, 10);
      if (!printerId) { msg(UI.msg_error + ' ' + UI.select_printer, 'error'); return; }
      const quantity = parseInt($('quantity-input').value, 10) || 1;
      const script = $('script-text').value || currentScript;
      if (!script) { msg(UI.no_script, 'error'); return; }

      const isTrace = currentLabel.is_traceability;
      const payload = {
        label_id: currentLabel.materialeid,
        printer_id: printerId,
        quantity: quantity,
        script: script,
        order_ids: []
      };
      if (!isTrace) {
        payload.prefix = $('prefix-input').value || '';
        payload.suffix = $('suffix-input').value || '';
        payload.counter = parseInt($('counter-input').value, 10) || 0;
      }

      try {
        const res = await apiFetch('/print/api/generic/print', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        let text = UI.print_success
          .replace('{quantity}', res.printed)
          .replace('{from}', res.counter_from)
          .replace('{to}', res.counter_to);
        if (res.file_path) text += ' ' + UI.print_file_fallback.replace('{path}', res.file_path);
        msg(text, 'success');
        if (!isTrace && res.next_counter) {
          currentLabel.counter.LastCounter = res.next_counter;
          $('counter-input').value = res.next_counter;
        }
      } catch (e) {
        msg(UI.msg_error + (e.message || e), 'error');
      }
    });

    loadData();
  </script>
</body>
</html>
